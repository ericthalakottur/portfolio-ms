spring:
  application:
    name: portfolio-ms
  output:
    ansi:
      enabled: ALWAYS

server:
  servlet:
    context-path: /api

# Spring Boot Actuator configuration
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

resilience4j.ratelimiter:
  configs:
    default:
      registerHealthIndicator: false
      limitForPeriod: 10
      limitRefreshPeriod: 2s
      timeoutDuration: 0